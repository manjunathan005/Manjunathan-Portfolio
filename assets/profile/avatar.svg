<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#avatarBg)"/>

  <!-- Tech Grid Background -->
  <path d="M40 0 v400 M80 0 v400 M120 0 v400 M160 0 v400 M200 0 v400 M240 0 v400 M280 0 v400 M320 0 v400 M360 0 v400" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
  <path d="M0 40 h400 M0 80 h400 M0 120 h400 M0 160 h400 M0 200 h400 M0 240 h400 M0 280 h400 M0 320 h400 M0 360 h400" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>

  <!-- Outer Neon Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="152" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="200" r="138" fill="#131c31" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Developer Silhouette / Character -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Jacket -->
    <path d="M120 310 C120 255, 150 240, 200 240 C250 240, 280 255, 280 310 Z" fill="#1e293b"/>
    <path d="M140 310 C140 268, 165 252, 200 252 C235 252, 260 268, 260 310 Z" fill="#0f172a"/>
    <path d="M185 240 L200 270 L215 240 Z" fill="#00f2fe" opacity="0.9"/>

    <!-- Neck -->
    <rect x="186" y="215" width="28" height="30" rx="6" fill="#f8d7b8"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="180" rx="42" ry="48" fill="#fbdcb9"/>

    <!-- Stylish Modern Hair -->
    <path d="M155 170 C155 130, 180 120, 215 125 C235 128, 245 142, 245 165 C238 160, 225 156, 210 156 C190 156, 170 162, 155 170 Z" fill="#1e1e24"/>
    <path d="M156 168 C153 182, 153 190, 156 195 C158 190, 160 178, 163 172 Z" fill="#1e1e24"/>

    <!-- Smart Glasses -->
    <rect x="168" y="168" width="26" height="18" rx="5" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5"/>
    <rect x="206" y="168" width="26" height="18" rx="5" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5"/>
    <line x1="194" y1="177" x2="206" y2="177" stroke="#00f2fe" stroke-width="2.5"/>
    <circle cx="178" cy="176" r="3" fill="#38bdf8"/>
    <circle cx="216" cy="176" r="3" fill="#38bdf8"/>

    <!-- Confident Smile -->
    <path d="M190 205 Q200 214 210 205" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating Tech Badges -->
  <!-- Java Badge Left -->
  <g transform="translate(60, 120)">
    <circle cx="22" cy="22" r="22" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="27" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#f97316" text-anchor="middle">☕</text>
  </g>

  <!-- Spring Badge Right -->
  <g transform="translate(300, 120)">
    <circle cx="22" cy="22" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="27" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#10b981" text-anchor="middle">🍃</text>
  </g>

  <!-- React Badge Bottom Right -->
  <g transform="translate(290, 240)">
    <circle cx="22" cy="22" r="22" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
    <text x="22" y="27" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#00f2fe" text-anchor="middle">⚛</text>
  </g>

  <!-- AI / Brain Badge Bottom Left -->
  <g transform="translate(68, 240)">
    <circle cx="22" cy="22" r="22" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="22" y="27" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#a855f7" text-anchor="middle">🧠</text>
  </g>

  <!-- Floating Code Terminal Snippet at Bottom -->
  <g transform="translate(70, 318)">
    <rect width="260" height="58" rx="12" fill="#0a0f1d" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.95"/>
    <!-- Terminal dots -->
    <circle cx="20" cy="18" r="4" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4" fill="#eab308"/>
    <circle cx="48" cy="18" r="4" fill="#10b981"/>
    <!-- Code text -->
    <text x="64" y="21" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">Developer.builder()</text>
    <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f2fe">.focus(<tspan fill="#34d399">"Java &amp; Full-Stack"</tspan>)</text>
  </g>
</svg>
